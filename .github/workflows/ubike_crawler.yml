name: YouBike Data Crawler

on:
  schedule:
    # 每 5 分鐘執行一次 (UTC 時間；注意 GitHub Actions 排程在高負載時可能會有數分鐘延遲)
    - cron: '*/5 * * * *'
  workflow_dispatch: # 支援在 GitHub 介面上手動點擊「Run workflow」觸發測試

permissions:
  contents: write # 允許 Actions 自動 commit 並 push 回專案儲存庫

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: 簽出專案程式碼 (Checkout code)
        uses: actions/checkout@v4

      - name: 設定 Python 環境 (Set up Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝相依套件 (Install dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: 執行資料爬取 (Run get_ubike_data.py)
        run: |
          python get_ubike_data.py

      - name: 提交並推送資料庫更新 (Commit & Push ubike.db)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ubike.db
          # 如果資料庫有變更才進行 commit 與 push，避免無變更時報錯
          if git diff --staged --quiet; then
            echo "沒有偵測到資料庫變更，略過提交。"
          else
            git commit -m "Auto: Update ubike.db [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            git push
          fi
